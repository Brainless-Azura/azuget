# AzuGet - miroir statique servi par nginx (port 80, réseau local).
# Pour l'exposer plus tard sur Internet : un tunnel sortant (cloudflared / tailscale funnel) vers 127.0.0.1:80,
# jamais une ouverture de port sur la box.

map $uri $azuget_cache {
    default                       "no-cache";
    ~^/v1/[^/]+/files/            "public, max-age=31536000, immutable";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /srv/azuget;
    server_tokens off;
    charset utf-8;
    access_log /var/log/nginx/azuget.access.log;
    error_log  /var/log/nginx/azuget.error.log;

    add_header Cache-Control $azuget_cache always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options nosniff always;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # les signatures sont du JSON
    location ~ \.sig$ {
        types { }
        default_type application/json;
    }

    location /v1/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime off;
    }

    location ~ /\. {
        deny all;
    }

    include /etc/nginx/azuget.d/*.conf;
}
